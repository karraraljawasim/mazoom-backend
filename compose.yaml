services:
  postgres:
    image: postgres:18
    container_name: mazoom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mazoom_user
      POSTGRES_PASSWORD: mazoom_password
      POSTGRES_DB: mazoom_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: mazoom_redis
    restart: unless-stopped
    ports:
      - "6379:6379"


volumes:
  postgres-data: